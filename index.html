  },
  "nodos": [
    {"id": "P", "titulo": "Gestión informal e ineficiente del proceso posconsumo de las baterías de plomo-ácido en Bogotá y Soacha", "why": "Describe la situación negativa del proceso posconsumo de las baterías usadas plomo ácido (BUPA) [1]: lo que ocurre desde que una batería se desecha al final de su vida útil hasta su aprovechamiento, con la participación de usuarios, establecimientos de cambio, transportadores, gestores licenciados y autoridades [1]. En él convergen las causas de orden económico, informativo, operativo y químico, y de él se derivan los efectos sobre la salud, el ambiente y el cumplimiento regulatorio. Esto ocurre aun cuando Colombia cuenta, desde 2026, con un régimen de Responsabilidad Extendida del Productor para las BUPA [1]. Territorio: Bogotá registró un parque automotor de 2,6 millones de vehículos en 2024 [2], dentro de 21,3 millones de vehículos activos en el país al cierre de 2025 [3], y Soacha ha sido señalado como lugar de aprovechamiento del plomo de esas baterías, en parte de manera informal [4][5][6]; ambos forman un mismo circuito. Informal: parte de las BUPA sale del sistema autorizado hacia compradores ambulantes, chatarrerías y fundidoras sin licencia [6][7][8][5]. Ineficiente: dentro del canal formal, el recorrido de cada batería es lento y difícil de demostrar [1][9]."},
    {"id": "E1", "titulo": "Intoxicación por plomo en trabajadores informales, sus familias y comunidades vecinas", "why": "El reciclaje informal expone al plomo a trabajadores, a sus familias y a las comunidades vecinas. En Soacha y Bogotá, los 32 niños examinados que vivían con un adulto dedicado al reciclaje informal de baterías presentaron niveles de plomo en sangre de dos a nueve veces el máximo aceptable, y los niveles fueron mayores cuando el reciclaje se hacía dentro de la vivienda [6]. En Cundinamarca, los trabajadores informales del reciclaje de baterías tuvieron niveles de plomo en sangre mayores que la población no expuesta [19]. El plomo es un tóxico acumulativo, especialmente dañino en niños [12]."},
    {"id": "E2", "titulo": "Contaminación del aire, los suelos y las viviendas con plomo y ácido sulfúrico", "why": "El plomo y el ácido sulfúrico pueden causar daños irreversibles en el ambiente [13], y el reciclaje de baterías es una causa importante de contaminación ambiental [12]. El diagnóstico elaborado para la Secretaría Distrital de Ambiente sobre las baterías usadas de Bogotá identificó, en el aprovechamiento de baja tecnología, contaminación del aire por emisiones de plomo y contaminación del suelo y del agua por deposición de partículas de plomo, descarga de escoria y del electrolito [4]. En Soacha y Bogotá, parte del reciclaje informal se realizaba dentro de las viviendas, donde los niños presentaron los niveles más altos de plomo [6]. En Soacha, además, se han medido concentraciones de plomo en partículas atmosféricas de las vías que superan los límites de referencia por inhalación, aunque ese estudio no atribuye el plomo a una fuente específica [26]."},
    {"id": "E3", "titulo": "Pérdida de volumen de las BUPA de los gestores licenciados frente a los compradores informales", "why": "Cada BUPA que capta el canal informal deja de llegar a un gestor licenciado. En Bogotá, ese canal ofrece pago de contado por las baterías [8], y en Soacha y sus alrededores operan fundiciones informales de plomo de baterías [5]. El diagnóstico distrital de alrededor del año 2000 ya describía pequeñas y medianas empresas de aprovechamiento que operaban en el mercado de manera informal [4]. A nivel nacional, en 2024 los planes posconsumo de BUPA validaron 405.383 unidades menos que su meta [27]. No se encontró una cifra pública reciente del volumen que capta el canal informal en Bogotá y Soacha, y el indicador distrital de baterías recolectadas figura como finalizado desde 2024 [16], lo que también refleja la fragmentación descrita en C2."},
    {"id": "E4", "titulo": "Incumplimiento de las metas de recolección de BUPA exigidas a los productores", "why": "La meta de recolección es la cantidad mínima de BUPA que los productores deben recolectar y gestionar cada año, y es de alcance nacional. Según la ANLA, en 2024 los planes posconsumo de baterías plomo ácido validaron 2.804.844 unidades frente a una meta de 3.210.227, con un cumplimiento del 87,37 % [27]. La cifra validada además bajó respecto a las 3.077.275 unidades de 2023 [27]. Bogotá registró un parque automotor de 2,6 millones de vehículos en 2024 [2]; por ese tamaño, lo que ocurra con las BUPA de la ciudad y su circuito con Soacha incide en ese cumplimiento. Desde 2026 rige la Resolución 0799, con un nuevo indicador de recolección y gestión [1]."},
    {"id": "C1", "titulo": "La batería usada se paga mejor en el canal informal que en el formal", "area": "Transversal", "why": "La Resolución 0799 de 2025 obliga a los comercializadores a recibir las BUPA sin costo para el usuario [1], pero no contempla un pago en dinero para quien la entrega, ya sea el usuario o el establecimiento. En contraste, en Bogotá existe un mercado abierto de compradores que ofrecen pagar de contado por la batería usada, como lo muestra la oferta pública de chatarrerías de la ciudad [8]. Parte de estos compradores puede ofrecer ese pago porque opera sin asumir los costos de cumplimiento ambiental: en Soacha y sus alrededores se han documentado fundiciones de plomo de baterías que operan con hornos artesanales y de manera informal [5]. Para una persona que tenga una BUPA en la mano, el canal informal resulta económicamente más atractivo que el formal."},
    {"id": "C1.1", "titulo": "Los compradores y fundidores informales operan sin licencia y sin asumir los costos de cumplimiento ambiental", "area": "Química", "why": "Los compradores y fundidores informales operan sin licencia ambiental ni permisos, por lo que no asumen costos de control de emisiones, manejo de residuos ni seguridad laboral. En Soacha, un trabajo de grado de 2018 describió industrias de fundición de plomo de baterías que operan con hornos cubilote en su mayoría artesanales, de manera informal e incumpliendo la normatividad [5]. En hogares de Soacha y Bogotá, el reciclaje de baterías se realizaba de forma artesanal y, en ocasiones, dentro de las propias viviendas [6]. Operar sin esos costos les permite pagar más por cada batería."},
    {"id": "C1.2", "titulo": "La devolución formal es gratuita y no reporta un pago en dinero a quien entrega la batería", "area": "Transversal", "why": "La norma obliga a recibir las BUPA sin costo para el usuario [1], pero no prevé un pago por entregarlas. El sistema colectivo Recoenergy ofrece a los comercializadores vinculados un plan de puntos redimibles por premios [10], que no es un pago en dinero, a diferencia del pago de contado que ofrece el comprador informal [8]. El establecimiento, además, asume el almacenamiento y el control mensual de entradas y salidas sin compensación [1]. Un análisis de los programas posconsumo en Bogotá identificó la falta de incentivos para el usuario final como uno de sus desafíos [11]."},
    {"id": "C1.3", "titulo": "El plomo de la batería usada conserva un alto valor en el mercado", "area": "Transversal", "why": "La fabricación de baterías de plomo-ácido concentra cerca del 85 % de la demanda mundial de plomo refinado, y buena parte se abastece con plomo reciclado de estas mismas baterías [12]. Por eso la BUPA siempre tiene comprador. El proyecto no puede modificar este factor; en la Matriz de Marco Lógico se tratará como supuesto."},
    {"id": "C2", "titulo": "La información de la cadena está fragmentada entre actores y registros", "area": "Sistemas", "why": "La trazabilidad de las BUPA descansa en los certificados de gestión que emiten los gestores licenciados [13]. Sin embargo, cada actor registra su parte de la cadena por separado: los establecimientos llevan su propio control de entradas y salidas, los gestores expiden certificados desde sus propios sistemas [1] y el módulo de gestores del RUA no incluye la etapa de transporte [9]. Como resultado, la información no se encuentra en un solo lugar y su validación depende de canales manuales. Por ejemplo, la constancia que expide Recoenergy a los establecimientos vinculados indica que su validez debe confirmarse por vía telefónica [14]. Estos registros y certificados son de alcance nacional, por lo que la situación es la misma en Bogotá y en Soacha."},
    {"id": "C2.1", "titulo": "Establecimientos y gestores registran su parte de la cadena en formatos y sistemas propios", "area": "Sistemas", "why": "Cada establecimiento lleva su propio control mensual de ingreso y salida de BUPA, en formato físico o electrónico, y cada gestor expide los certificados desde sus propios sistemas, con plazos de hasta 90 días hábiles [1]. Esa información no se consolida en ningún punto común de consulta."},
    {"id": "C2.2", "titulo": "La etapa de transporte queda por fuera del registro RUA", "area": "Sistemas", "why": "El módulo de gestores del Registro Único Ambiental del IDEAM no incluye la actividad de transporte [9]. El transportador solo queda identificado en el certificado que el gestor emite al final del ciclo [1], por lo que el tramo entre el establecimiento y la planta no se registra mientras ocurre."},
    {"id": "C2.3", "titulo": "Las entidades públicas administran registros separados sobre la misma cadena", "area": "Sistemas", "why": "Los productores presentan sus sistemas de recolección ante la ANLA a través de VITAL, y deben entregar un informe anual [15][1]. La información de residuos peligrosos, en cambio, se reporta al IDEAM mediante el RUA [9]. Son registros distintos, de periodicidad anual, que no permiten seguir una misma batería entre ellos. En el nivel distrital, el indicador del Observatorio Ambiental de Bogotá sobre los kilogramos de baterías plomo ácido recolectados por programas posconsumo en la ciudad figura como finalizado desde abril de 2024 [16]."},
    {"id": "C3", "titulo": "La recolección formal es poco accesible para los pequeños generadores", "area": "Mecánica", "why": "La red formal combina puntos fijos de recolección para el usuario final con un canal institucional de recogida para establecimientos y empresas [10][17]. En Bogotá, el usuario debe ubicar el punto fijo más cercano en el visor geográfico de la Secretaría Distrital de Ambiente, y las empresas pueden gestionar sus baterías por solicitud o en jornadas periódicas como la Reciclatón [17][18]. Para los establecimientos, la recogida exige un mínimo de 15 unidades o 30 kg y puede tardar entre 8 y 15 días hábiles [10]. Para un establecimiento pequeño, esto implica acumular residuos peligrosos durante semanas, mientras el comprador informal paga de contado por cada batería [8]."},
    {"id": "C3.1", "titulo": "La recolección exige un mínimo de 15 unidades o 30 kg por solicitud", "area": "Mecánica", "why": "Recoenergy atiende solicitudes de recolección a partir de 15 unidades o 30 kg de baterías usadas [10]. Un establecimiento pequeño debe acumular residuos peligrosos hasta alcanzar ese volumen antes de poder solicitar la recogida."},
    {"id": "C3.2", "titulo": "La recogida tarda entre 8 y 15 días hábiles desde la solicitud", "area": "Mecánica", "why": "Una vez solicitada, la recolección puede tardar entre 8 y 15 días hábiles, según la ubicación del establecimiento [10]. Durante ese tiempo la batería permanece en el establecimiento, mientras existen compradores que la pagan de contado [8]."},
    {"id": "C3.3", "titulo": "La solicitud de recolección exige un trámite previo de formulario y validación", "area": "Mecánica", "why": "Para solicitar la recogida, el establecimiento debe diligenciar un formulario y enviarlo por correo; los datos se validan y la solicitud solo se procesa si la empresa cumple los requisitos [10]. El canal institucional de la Secretaría Distrital de Ambiente también exige informar por correo el tipo de residuo, la cantidad de unidades y el peso [17], y en la Reciclatón Distrital Empresarial las empresas deben registrarse con anticipación para recibir fecha y hora de entrega [18]. Cada uno de estos pasos ocurre antes de que la batería salga del establecimiento."},
    {"id": "C4", "titulo": "Usuarios y trabajadores subestiman el riesgo químico de las BUPA", "area": "Química", "why": "El plomo y el ácido sulfúrico de las baterías son sustancias altamente tóxicas, capaces de causar daños irreversibles en la salud y el ambiente [13]. Aun así, quienes manipulan las BUPA en el sector informal no dimensionan ese riesgo. En un estudio con trabajadores informales de reciclaje de baterías en Cundinamarca, el nivel educativo y el uso de elementos de protección personal fueron predictores significativos de los niveles de plomo en sangre [19]. Un estudio del mismo grupo de investigación, con 120 trabajadores informales, concluyó que estos desconocen los riesgos de la exposición crónica y silenciosa al plomo [20]. En Soacha y Bogotá, parte de este reciclaje se hacía dentro de las viviendas, donde vivían niños [6]. Esa baja percepción del riesgo explica por qué la batería se entrega a cualquier comprador y se manipula sin protección."},
    {"id": "C4.1", "titulo": "La información sobre el manejo de las BUPA se encuentra repartida entre varios actores obligados y llega de forma discontinua", "area": "Química", "why": "La Resolución 0799 asigna la obligación de informar a productores, comercializadores, autoridades ambientales y entidades territoriales [1], sin un canal común entre ellos. En Bogotá, los puntos de entrega se consultan en el visor geográfico de la Secretaría Distrital de Ambiente [17], separados de los que publica cada sistema colectivo [10]. La aplicación Red PosConsumo, que el Ministerio lanzó en 2014 para ubicar puntos de recolección [21], ya no se encuentra disponible en las tiendas de aplicaciones (verificación del equipo, 2026), lo que muestra la discontinuidad de estos esfuerzos."},
    {"id": "C4.2", "titulo": "Los efectos del plomo en la salud son crónicos y poco visibles en el corto plazo", "area": "Química", "why": "La intoxicación por plomo suele ser un trastorno crónico que puede no producir síntomas agudos, y como sus síntomas son inespecíficos, el diagnóstico a menudo se retrasa [22]. Quien manipula baterías no percibe un daño inmediato y, por eso, subestima el riesgo."},
    {"id": "C4.3", "titulo": "Los trabajadores informales tienen bajo nivel educativo y desconocen el riesgo de la exposición crónica", "area": "Química", "why": "En trabajadores informales de reciclaje de baterías de Cundinamarca, el nivel educativo fue un predictor significativo de los niveles de plomo en sangre [19]. Un estudio del mismo grupo de investigación concluyó que estos trabajadores desconocen los riesgos de la exposición crónica y recomendó intervenciones culturalmente significativas [20]."},
    {"id": "C5", "titulo": "El control de las autoridades sobre la cadena de las BUPA es reactivo", "area": "Transversal", "why": "Se entiende por control reactivo aquel que actúa después de que el daño ya ocurrió o se hizo visible, en lugar de prevenirlo. El caso documentado en Soacha lo ilustra: el problema se conoció en septiembre de 2004, cuando una niña ingresó a un hospital de Soacha con una fractura patológica y niveles tóxicos de plomo en sangre; solo entonces la visita a su vivienda reveló que sus padres reciclaban baterías de manera informal y permitió identificar otros hogares en la misma situación [6]. En febrero de 2026, tras una visita técnica, la CAR suspendió tres fundidoras en Soacha cuyos hornos operaban sin permiso de emisiones atmosféricas ni registro como generadoras de residuos peligrosos; la fuente no precisa qué metal se fundía [23]. El marco actual mantiene esta lógica: la información de los establecimientos se verifica cuando la autoridad realiza actividades de control (art. 20) y las autoridades ambientales tienen dos años para caracterizar la informalidad en su jurisdicción (art. 23) [1]."},
    {"id": "C5.1", "titulo": "El cumplimiento de los establecimientos solo se verifica durante visitas de control", "area": "Transversal", "why": "La norma establece que la autoridad ambiental urbana o regional podrá verificar el control mensual de los establecimientos [1]. El Ministerio anunció que se intensificará el control en servitecas, talleres y otros puntos de cambio [13]; en ambos casos, la verificación depende de visitas presenciales y no de un seguimiento continuo."},
    {"id": "C5.2", "titulo": "Las autoridades ambientales aún no han caracterizado la informalidad en su jurisdicción", "area": "Transversal", "why": "La Resolución 0799 da a las autoridades ambientales dos años desde su entrada en vigencia, en 2026, para elaborar un diagnóstico del manejo de BUPA en su jurisdicción, incluida la caracterización de la informalidad [1]. En este territorio esa tarea corresponde a la Secretaría Distrital de Ambiente en Bogotá y a la CAR en Soacha (ver C5.3). Mientras tanto, el control se ejerce sin conocer la magnitud del problema."},
    {"id": "C5.3", "titulo": "La vigilancia de la cadena se reparte entre dos autoridades ambientales con jurisdicciones distintas", "area": "Transversal", "why": "Por mandato de la Ley 99 de 1993, en el perímetro urbano de los distritos con población urbana igual o superior a un millón de habitantes, las funciones de autoridad ambiental las ejerce el propio distrito [24]. En Bogotá, la Secretaría Distrital de Ambiente realiza los operativos de control a la industria [25] y gestiona el canal institucional de entrega de BUPA [17]. En Soacha, en cambio, el control lo ejerce la CAR, como muestran sus actuaciones sobre fundidoras en ese municipio [23]. Así, una misma batería puede desecharse bajo una jurisdicción y fundirse bajo la otra [4][6], y cada autoridad vigila solo su tramo de la cadena."}
  ],

<style>
:root{
  --ink:#201e1d; --ink-2:#605d5d; --ink-3:#9b9797; --rule:#cfcccb; --rule-strong:#201e1d;

  --dir-bg:#bbe7ff; --dir-bd:#2d86c8; --dir-fg:#002139; --dir-sub:#014b79;

html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}

/* — encabezado — */

.pop{position:fixed;z-index:30;width:360px;max-height:calc(100vh - 100px);overflow:auto;background:var(--paper);border:2px solid var(--ink);box-shadow:var(--shadow-lg);padding:16px 18px;display:none;flex-direction:column;gap:10px}

.toast.show{display:block}

/* — hoja de exportación (fuera de pantalla) — */
#sheet{position:fixed;left:-20000px;top:0;background:#fff;color:var(--ink);padding:56px 64px 40px}
#sheet .s-head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;padding-bottom:18px;border-bottom:3px solid var(--ink);margin-bottom:28px}
#sheet .s-brand{display:flex;align-items:center;gap:18px}
#sheet .s-brand img{width:72px;height:72px}
#sheet .s-kicker{font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
#sheet h1{margin:2px 0 0;font-size:40px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
#sheet .s-meta{text-align:right;font-size:14px;line-height:1.5;color:var(--ink-2)}
#sheet .s-meta b{color:var(--ink)}
#sheet .s-legend{display:flex;gap:26px;font-size:14px;font-weight:600;margin-bottom:22px}
#sheet .s-legend div{display:flex;align-items:center;gap:8px}
#sheet .s-world{position:relative}
#sheet .s-foot{margin-top:26px;padding-top:14px;border-top:2px solid var(--rule);display:flex;justify-content:space-between;gap:40px;font-size:13px;color:var(--ink-2)}
#sheet .node{box-shadow:none;transform:none;cursor:default}

@media (max-width:820px){
  .top{padding:0 12px;gap:10px}
  .brand{gap:10px}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(() => {
'use strict';

/* ---------- geometría del árbol ---------- */
const COL_W = 300, COL_GAP = 28, MARGIN_L = 200, MARGIN_R = 40;
const SIZE = { effect:[300,146], problem:[620,176], direct:[300,146], indirect:[274,122] };
const IND_GAP = 14, IND_INDENT = 26, SPINE_OFF = 12;
const COLORS = {
  effect:  { bd:'#3b9555' }, problem:{ bd:'#45240f' },
  direct:  { bd:'#2d86c8' }, indirect:{ bd:'#ba6826' }
};
const TYPE_LABEL = { effect:'Efecto', problem:'Problema central', direct:'Causa directa', indirect:'Causa indirecta' };

const nodes = DATA.nodos.map(n => ({
  ...n,
  type: n.id === 'P' ? 'problem' : n.id.startsWith('E') ? 'effect' : n.id.includes('.') ? 'indirect' : 'direct',
  parent: n.id.includes('.') ? n.id.split('.')[0] : null
}));
const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
const effects = nodes.filter(n => n.type === 'effect');
const directs = nodes.filter(n => n.type === 'direct');
const maxInd = Math.max(1, ...directs.map(d => nodes.filter(n => n.parent === d.id).length));

const nCols = Math.max(directs.length, effects.length);
const WORLD_W = MARGIN_L + MARGIN_R + nCols * COL_W + (nCols - 1) * COL_GAP;
const CX = MARGIN_L + (WORLD_W - MARGIN_L - MARGIN_R) / 2;
const ROW = { l1:24, effect:70, l2:256, problem:302, l3:520, direct:566, l4:754, indirect:800 };
const WORLD_H = ROW.indirect + maxInd * SIZE.indirect[1] + (maxInd - 1) * IND_GAP + 30;

/* aristas: causa → efecto (la flecha apunta hacia arriba) */
const EDGES = [];
nodes.forEach(n => {
  if (n.type === 'indirect') EDGES.push([n.id, n.parent]);
  if (n.type === 'direct') EDGES.push([n.id, 'P']);
  if (n.type === 'effect') EDGES.push(['P', n.id]);
});

function initPos() {
  const p = {};
  const rowStart = (count, w, gap) => CX - (count * w + (count - 1) * gap) / 2;
  const e0 = rowStart(effects.length, SIZE.effect[0], COL_GAP + 22);
  effects.forEach((n, i) => p[n.id] = { x: e0 + i * (SIZE.effect[0] + COL_GAP + 22), y: ROW.effect });
  p.P = { x: CX - SIZE.problem[0] / 2, y: ROW.problem };
  const d0 = rowStart(directs.length, COL_W, COL_GAP);
  directs.forEach((d, i) => {
    const x = d0 + i * (COL_W + COL_GAP);
    p[d.id] = { x, y: ROW.direct };
    nodes.filter(n => n.parent === d.id).forEach((c, j) => {
      p[c.id] = { x: x + IND_INDENT, y: ROW.indirect + j * (SIZE.indirect[1] + IND_GAP) };
    });
  });
  return p;
}

/* ---------- estado ---------- */
const S = { pos: initPos(), z: 1, px: 0, py: 0, sel: null };
const vp = document.getElementById('vp');
const world = document.getElementById('world');

/* ---------- utilidades ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const edgeColor = ([a, b]) => COLORS[byId[a].type === 'problem' ? byId[b].type : byId[a].type].bd;

function edgePath(a, b, pos) {
  const A = byId[a], B = byId[b], pa = pos[a], pb = pos[b];
  if (A.type === 'indirect') {
    const spine = pb.x + SPINE_OFF;
    const y = pa.y + SIZE.indirect[1] / 2;
    return `M${pa.x} ${y} H${spine} V${pb.y + SIZE[B.type][1] + 7}`;
  }
  const sx = pa.x + SIZE[A.type][0] / 2, sy = pa.y;
  const ex = pb.x + SIZE[B.type][0] / 2, ey = pb.y + SIZE[B.type][1] + 7;
  const my = (sy + ey) / 2;
  return `M${sx} ${sy} C${sx} ${my}, ${ex} ${my}, ${ex} ${ey}`;
}

function chain(sel) {
  if (!sel) return null;
  const set = new Set([sel]), n = byId[sel];
  if (n.type === 'problem') { nodes.forEach(x => set.add(x.id)); return set; }
  if (n.type === 'effect') { set.add('P'); return set; }
  const down = id => EDGES.forEach(([a, b]) => { if (b === id && !set.has(a)) { set.add(a); down(a); } });
  const up = id => EDGES.forEach(([a, b]) => { if (a === id && !set.has(b)) { set.add(b); up(b); } });
  down(sel); up(sel);
  return set;
}

function edgesSVG(pos, set, w, h, ox = 0, oy = 0) {
  const defs = EDGES.map((e, i) => `<marker id="mk${i}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${edgeColor(e)}"/></marker>`).join('');
  const paths = EDGES.map((e, i) => {
    const on = set && set.has(e[0]) && set.has(e[1]), dim = set && !on;
    return `<path d="${edgePath(e[0], e[1], pos)}" fill="none" stroke="${edgeColor(e)}" stroke-width="${on ? 4 : 2.5}" stroke-linejoin="round" marker-end="url(#mk${i})" opacity="${dim ? .15 : 1}"/>`;
  }).join('');
  return `<svg class="edges" width="${w}" height="${h}" viewBox="${ox} ${oy} ${w} ${h}" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${paths}</svg>`;
}

function nodeHTML(n) {
  const area = n.area ? `<span class="area">${esc(n.area)}</span>` : '';
  const code = n.type === 'problem' ? `${n.id} · ${TYPE_LABEL.problem}` : n.id;
  return `<div class="meta"><span>${esc(code)}</span>${area}</div><div class="txt">${esc(n.titulo)}</div>`;
}

function bandsHTML(w) {
  const b = (y, label, soft) => `<div class="band-line${soft ? ' soft' : ''}" style="top:${y}px;width:${w}px"></div><div class="band-label${soft ? ' soft' : ''}" style="top:${y + 12}px">${label}</div>`;
  return b(ROW.l1, '01 — Efectos') + b(ROW.l2, '02 — Problema central') + b(ROW.l3, '03 — Causas directas') + b(ROW.l4, '04 — Causas indirectas', true);
}

/* ---------- construcción del lienzo interactivo ---------- */
world.style.width = WORLD_W + 'px';
world.style.height = WORLD_H + 'px';
world.innerHTML = bandsHTML(WORLD_W) + '<div id="edgeHost"></div>';
const edgeHost = document.getElementById('edgeHost');
const els = {};
nodes.forEach(n => {
  const el = document.createElement('div');
  el.className = 'node ' + n.type;
  el.tabIndex = 0;
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', `${TYPE_LABEL[n.type]} ${n.id}: ${n.titulo}`);
  el.style.width = SIZE[n.type][0] + 'px';
  el.style.height = SIZE[n.type][1] + 'px';
  el.innerHTML = nodeHTML(n);
  el.addEventListener('pointerdown', e => onNodeDown(n.id, e));
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(S.sel === n.id ? null : n.id); } });
  world.appendChild(el);
  els[n.id] = el;
});

function render() {
  const set = chain(S.sel);
  world.style.transform = `translate(${S.px}px,${S.py}px) scale(${S.z})`;
  edgeHost.innerHTML = edgesSVG(S.pos, set, WORLD_W, WORLD_H);
  nodes.forEach(n => {
    const el = els[n.id], p = S.pos[n.id];
    el.style.left = p.x + 'px';
    el.style.top = p.y + 'px';
    el.classList.toggle('dim', !!set && !set.has(n.id));
    el.classList.toggle('selected', S.sel === n.id);
  });
  document.getElementById('zPct').textContent = Math.round(S.z * 100) + '%';
  renderPop();
}

/* ---------- vista: ajustar, zoom y desplazamiento ---------- */
function fit(resetPos) {
  const w = vp.clientWidth, h = vp.clientHeight;
  const narrow = w < 820;
  const padL = narrow ? 12 : 24, padR = narrow ? 12 : 24, padT = 20, padB = narrow ? 150 : 130;
  const z = Math.min((w - padL - padR) / WORLD_W, (h - padT - padB) / WORLD_H, 1.1);
  S.z = Math.max(z, .2);
  S.px = padL + (w - padL - padR - WORLD_W * S.z) / 2;
  S.py = padT + (h - padT - padB - WORLD_H * S.z) / 2;
  if (resetPos) { S.pos = initPos(); S.sel = null; }
  render();
}
function zoomAt(cx, cy, f) {
  const z = Math.max(.2, Math.min(2.5, S.z * f)), k = z / S.z;
  S.px = cx - (cx - S.px) * k; S.py = cy - (cy - S.py) * k; S.z = z;
  render();
}
const zoomCenter = f => zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, f);
vp.addEventListener('wheel', e => {
  e.preventDefault();
  const r = vp.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * .0015));
}, { passive:false });
document.getElementById('zIn').onclick = () => zoomCenter(1.2);
document.getElementById('zOut').onclick = () => zoomCenter(1 / 1.2);
document.getElementById('zReset').onclick = () => fit(true);
window.addEventListener('resize', () => fit(false));

let drag = null;
function onNodeDown(id, e) {
  if (e.button !== 0) return;
  e.stopPropagation();
  const p = S.pos[id];
  drag = { kind:'node', id, sx:e.clientX, sy:e.clientY, ox:p.x, oy:p.y, moved:false };
}
vp.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  drag = { kind:'pan', sx:e.clientX, sy:e.clientY, ox:S.px, oy:S.py, moved:false };
  vp.classList.add('panning');
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 4) {
    drag.moved = true;
    if (drag.kind === 'node') els[drag.id].classList.add('dragging');
  }
  if (!drag.moved) return;
  if (drag.kind === 'node') S.pos[drag.id] = { x: drag.ox + dx / S.z, y: drag.oy + dy / S.z };
  else { S.px = drag.ox + dx; S.py = drag.oy + dy; }
  render();
});
window.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  vp.classList.remove('panning');
  if (d.kind === 'node') {
    els[d.id].classList.remove('dragging');
    if (!d.moved) select(S.sel === d.id ? null : d.id);
  } else if (!d.moved) select(null);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') select(null); });

/* ---------- ventana de justificación ---------- */
const pop = document.getElementById('pop');
document.getElementById('popClose').onclick = () => select(null);
pop.addEventListener('pointerdown', e => e.stopPropagation());
function select(id) { S.sel = id; render(); }

function renderPop() {
  const n = S.sel && byId[S.sel];
  pop.classList.toggle('open', !!n);
  if (!n) return;
  document.getElementById('popKicker').textContent = `${TYPE_LABEL[n.type]} · ${n.id}${n.area ? ' · ' + n.area : ''}`;
  document.getElementById('popTitle').textContent = n.titulo;
  document.getElementById('popText').textContent = n.why;
  const nums = [...new Set((n.why.match(/\[(\d+)\]/g) || []).map(s => s.slice(1, -1)))].sort((a, b) => a - b);
  document.getElementById('popRefsHead').style.display = nums.length ? '' : 'none';
  document.getElementById('popRefs').innerHTML = nums.map(k => {
    const t = esc(DATA.refs[k] || 'Referencia no encontrada en el documento de soporte.')
      .replace(/(https?:\/\/[^\s]+?)(\.?\s|\.?$)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>$2');
    return `<li><b>[${k}]</b> ${t}</li>`;
  }).join('');
  if (vp.clientWidth < 820) { pop.style.left = '12px'; pop.style.top = '76px'; return; }
  const p = S.pos[n.id], sz = SIZE[n.type], vw = window.innerWidth, vh = window.innerHeight;
  let left = S.px + (p.x + sz[0]) * S.z + 16;
  if (left + 360 > vw - 12) left = S.px + p.x * S.z - 376;
  left = Math.max(12, Math.min(left, vw - 372));
  const top = Math.max(76, Math.min(64 + S.py + p.y * S.z, vh - Math.min(pop.offsetHeight, vh - 100) - 16));
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}

/* ---------- encabezado ---------- */
document.getElementById('hdTeam').textContent = `${DATA.meta.curso} ${DATA.meta.equipo}`;
document.getElementById('hdProject').textContent = DATA.meta.proyecto;
document.getElementById('hdVersion').textContent = `Versión ${DATA.meta.version} · ${DATA.meta.fecha}`;

/* ---------- exportación a PDF ---------- */
const toast = msg => { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 3500); };

function buildSheet() {
  // límites reales del árbol (incluye elementos que se hayan arrastrado)
  let minX = 0, minY = 0, maxX = WORLD_W, maxY = WORLD_H;
  nodes.forEach(n => {
    const p = S.pos[n.id], s = SIZE[n.type];
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x + s[0]); maxY = Math.max(maxY, p.y + s[1] + 10);
  });
  const w = Math.ceil(maxX - minX), h = Math.ceil(maxY - minY);
  const sw = (bg, bd) => `<span class="sw" style="background:${bg};border-color:${bd}"></span>`;
  const sheet = document.getElementById('sheet');
  sheet.style.width = (w + 128) + 'px';
  sheet.innerHTML = `
    <div class="s-head">
      <div class="s-brand">
        <img src="${document.querySelector('.brand-team img').src}" alt="">
        <div><div class="s-kicker">${esc(DATA.meta.curso)} · ${esc(DATA.meta.equipo)}</div><h1>Árbol de problemas</h1><div class="s-kicker" style="margin-top:6px">${esc(DATA.meta.proyecto)}</div></div>
      </div>
      <div class="s-meta"><b>Versión ${esc(DATA.meta.version)}</b><br>${esc(DATA.meta.fecha)}<br>${esc(DATA.meta.institucion)}</div>
    </div>
    <div class="s-legend">
      <div>${sw('#c1efc9','#3b9555')}Efectos</div><div>${sw('#6c4128','#45240f')}Problema central</div>
      <div>${sw('#bbe7ff','#2d86c8')}Causa directa</div><div>${sw('#ffd6b5','#ba6826')}Causa indirecta</div>
    </div>
    <div class="s-world" style="width:${w}px;height:${h}px">
      <div style="position:absolute;left:${-minX}px;top:${-minY}px;width:${WORLD_W}px;height:${WORLD_H}px">
        ${bandsHTML(w + minX)}
        ${edgesSVG(S.pos, null, WORLD_W, WORLD_H)}
        ${nodes.map(n => `<div class="node ${n.type}" style="left:${S.pos[n.id].x}px;top:${S.pos[n.id].y}px;width:${SIZE[n.type][0]}px;height:${SIZE[n.type][1]}px">${nodeHTML(n)}</div>`).join('')}
      </div>
    </div>
    <div class="s-foot"><span>${esc(DATA.meta.notaPie)}</span><span>Generado desde problem-tree.html</span></div>`;
  return sheet;
}

document.getElementById('btnPdf').onclick = async () => {
  const btn = document.getElementById('btnPdf');
  if (!window.html2canvas || !window.jspdf) { toast('No se cargaron las librerías del PDF. Revisa tu conexión a internet y recarga la página.'); return; }
  btn.disabled = true;
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const sheet = buildSheet();
    const canvas = await html2canvas(sheet, { scale: 2.5, backgroundColor: '#ffffff', useCORS: true, logging: false });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a3', compress: true });
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight(), m = 8;
    const k = Math.min((pw - 2 * m) / canvas.width, (ph - 2 * m) / canvas.height);
    const iw = canvas.width * k, ih = canvas.height * k;
    pdf.setProperties({ title: `Árbol de problemas v${DATA.meta.version}`, subject: DATA.meta.proyecto, author: DATA.meta.equipo });
    pdf.addImage(canvas.toDataURL('image/jpeg', .95), 'JPEG', (pw - iw) / 2, (ph - ih) / 2, iw, ih);
    pdf.save(`Arbol_de_problemas_v${DATA.meta.version}.pdf`);
    sheet.innerHTML = '';
  } catch (err) {
    console.error(err);
    toast('No se pudo generar el PDF. Abre la consola del navegador para ver el detalle.');
  } finally {
    btn.disabled = false;
  }
};

fit(true);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());
})();
</script>
</body>
